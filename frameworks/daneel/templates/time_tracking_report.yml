# frameworks/daneel/templates/time_tracking_report.yml
# Schema spec for the time-tracking Excel workbook generated by
# generate_time_tracking_report.
# Path: clients/{slug}/output/reports/time_tracking_{start_date}_{end_date}.xlsx
# Created by: generate_time_tracking_report scenario (one-shot, on demand)
#
# There is no fill-in-the-blanks text template here (unlike the .yml
# templates) — an .xlsx can't be templated as text. This file documents the
# structure the scenario must produce via the xlsx skill.

language:
  rule: >
    The report is a client-facing document — it must be written in the
    client's own language, read from clients/{slug}/context.yml#language
    (e.g. "ru" for medsi), NOT in Igor's chat language (Italian) and NOT
    hardcoded. This applies to the sheet name, all column headers, and
    every task description written into the "Task" column — translate
    each task_description into that language before writing the row (the
    closing comment it comes from is in Italian; the report never is).
    Dates and the tracker code are language-neutral and need no
    translation.
  source: "clients/{slug}/context.yml#language"
  fallback: >
    If context.yml has no language field, ask Igor which language to use
    before generating — never default silently to Italian or English.

schema:
  sheet_name: "Tracking"           # translate into client language, e.g. ru: "Учёт времени"
  columns:
    - { name: "Date",          type: date,   format: "YYYY-MM-DD" }
    - { name: "Tracking code", type: string,  notes: "the client's own external tracker code (e.g. TORMED-389), extracted from the issue's closing comment — issues without one are excluded, never a synthetic fallback" }
    - { name: "Task",          type: string,  notes: "short description, from the closing comment's 'How it was resolved' — translated into the client's language (see language.rule above), not left in Italian" }
    - { name: "Hours",         type: number,  notes: "synthetic — see spreading algorithm, not a real per-task effort measurement" }
    # column headers themselves ("Date", "Tracking code", "Task", "Hours")
    # must also be translated into the client's language before writing

  daily_subtotal:
    rule: >
      One subtotal row per date (SUM of Hours for that date), or an
      equivalent per-date aggregation visible without scrolling — e.g. a
      bold subtotal row inserted after the last row of each date group.

  conditional_formatting:
    rule: >
      Highlight (e.g. red fill) any date whose subtotal is not exactly 8.
      This should never trigger if the spreading algorithm is correct —
      it exists as a visual guard against bugs, not a feature Igor
      interacts with.

# ---------------------------------------------------------------------------
# SPREADING ALGORITHM
# Distributes the closed tasks found in the period across the period's
# working days (Mon-Fri only) so every working day has >=1 row and sums to
# exactly 8h. Real per-task effort is not tracked — this is a reporting
# shape, not a diary.
# ---------------------------------------------------------------------------
spreading_algorithm: |
  Given:
    tasks           = closed issues for the client in [start_date, end_date]
                       THAT HAVE A NON-EMPTY tracking code (client's own
                       external tracker — issues with no tracking code are
                       not real client-tracked work and are dropped before
                       this step runs), each as {tracking_code,
                       task_description}, ordered by the issue's closed_at
                       timestamp
    working_days     = list of Mon-Fri calendar dates in [start_date, end_date]
    N                = count(tasks)
    D                = count(working_days)

  start_date = day after the previous report's end_date (no overlap between
  consecutive reports). end_date = today, the date the report is generated —
  not the date of the last closed issue, since the period must cover every
  working day up to now even if nothing closed recently.

  If N == 0:
    do not generate a file — tell the user there is nothing to report for
    this period.

  If N >= D:
    - Split `tasks` into D buckets in order, as evenly as possible
      (bucket sizes differ by at most 1 task).
    - Assign bucket i to working_days[i].
    - Within a day's bucket of k tasks, hours = 8/k per task (evenly split).

  If N < D:
    - Repeat `tasks` round-robin to produce exactly D entries, one per
      working day (task list cycles: task1, task2, ..., taskN, task1, ...).
    - Each working day gets exactly one row at 8h, using the task assigned
      to it by the round-robin cycle.

  Every working day must end up with hours summing to exactly 8 and at
  least one row. Non-working days (Sat/Sun) get no rows at all.

notes: >
  The tracking code is not free text and never synthetic — it must be the
  client's own external tracker code, captured as required input at
  ingest_task time (mandatory whenever a client_slug is set) and carried
  through to the issue's closing comment via close_task. Issues with no
  tracking code (internal/admin work, or client issues created before this
  requirement existed) are excluded from the report entirely, not given a
  fallback code.
