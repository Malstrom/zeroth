# frameworks/daneel/templates/time_tracking_report.yml
# Schema spec for the time-tracking Excel workbook generated by
# generate_time_tracking_report.
# Path: clients/{slug}/output/reports/time_tracking_{start_date}_{end_date}.xlsx
# Created by: generate_time_tracking_report scenario (one-shot, on demand)
#
# There is no fill-in-the-blanks text template here (unlike the .yml
# templates) — an .xlsx can't be templated as text. This file documents the
# structure the scenario must produce via the xlsx skill.

schema:
  sheet_name: "Tracking"
  columns:
    - { name: "Date",          type: date,   format: "YYYY-MM-DD" }
    - { name: "Tracking code", type: string,  notes: "{{slug}}-{{issue_number}}, extracted from the issue's closing comment" }
    - { name: "Task",          type: string,  notes: "short description, from the closing comment's 'How it was resolved'" }
    - { name: "Hours",         type: number,  notes: "synthetic — see spreading algorithm, not a real per-task effort measurement" }

  daily_subtotal:
    rule: >
      One subtotal row per date (SUM of Hours for that date), or an
      equivalent per-date aggregation visible without scrolling — e.g. a
      bold subtotal row inserted after the last row of each date group.

  conditional_formatting:
    rule: >
      Highlight (e.g. red fill) any date whose subtotal is not exactly 8.
      This should never trigger if the spreading algorithm is correct —
      it exists as a visual guard against bugs, not a feature Igor
      interacts with.

# ---------------------------------------------------------------------------
# SPREADING ALGORITHM
# Distributes the closed tasks found in the period across the period's
# working days (Mon-Fri only) so every working day has >=1 row and sums to
# exactly 8h. Real per-task effort is not tracked — this is a reporting
# shape, not a diary.
# ---------------------------------------------------------------------------
spreading_algorithm: |
  Given:
    tasks           = closed issues for the client in [start_date, end_date],
                       each as {tracking_code, task_description}, ordered by
                       the issue's closed_at timestamp
    working_days     = list of Mon-Fri calendar dates in [start_date, end_date]
    N                = count(tasks)
    D                = count(working_days)

  If N == 0:
    do not generate a file — tell the user there is nothing to report for
    this period.

  If N >= D:
    - Split `tasks` into D buckets in order, as evenly as possible
      (bucket sizes differ by at most 1 task).
    - Assign bucket i to working_days[i].
    - Within a day's bucket of k tasks, hours = 8/k per task (evenly split).

  If N < D:
    - Repeat `tasks` round-robin to produce exactly D entries, one per
      working day (task list cycles: task1, task2, ..., taskN, task1, ...).
    - Each working day gets exactly one row at 8h, using the task assigned
      to it by the round-robin cycle.

  Every working day must end up with hours summing to exactly 8 and at
  least one row. Non-working days (Sat/Sun) get no rows at all.

notes: >
  The tracking code is not free text — it must come from the issue's
  closing comment ("Tracking code" field, added by close_task). If an
  issue was closed before this field existed, fall back to
  "{{slug}}-{{issue_number}}" derived directly from the issue number.
