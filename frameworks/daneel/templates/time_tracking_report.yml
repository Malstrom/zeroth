# frameworks/daneel/templates/time_tracking_report.yml
# Schema spec for the time-tracking Excel workbook generated by
# generate_time_tracking_report.
# Path: clients/{slug}/output/reports/ТШ_{{operator.surname_cyrillic}}_{{Russian month name}} {{year}}.xlsx
#   (operator.surname_cyrillic from .daneel.yml — e.g. ТШ_Мироненко_Август 2026.xlsx)
# Created by: generate_time_tracking_report scenario (one-shot, on demand,
#   ONE FILE PER CALENDAR MONTH — see scenario for the month-splitting step)
#
# There is no fill-in-the-blanks text template here (unlike the .yml
# templates) — an .xlsx can't be templated as text. This file documents the
# structure the scenario must produce via the xlsx skill.

language:
  rule: >
    The report is a client-facing document — it must be written in the
    client's own language, read from clients/{slug}/context.yml#language
    (e.g. "ru" for medsi), NOT in Igor's chat language (Italian) and NOT
    hardcoded. This applies to the sheet name, all column headers, and
    every task description written into the "Task" column — translate
    each task_description into that language before writing the row (the
    closing comment it comes from is in Italian; the report never is).
    Dates and the tracker code are language-neutral and need no
    translation.
  source: "clients/{slug}/context.yml#language"
  fallback: >
    If context.yml has no language field, ask Igor which language to use
    before generating — never default silently to Italian or English.

# ---------------------------------------------------------------------------
# TASK WORDING RULES — mandatory whenever report_language == "ru"
# Source: Igor's "Памятка по ТШ" memo (tax/legal compliance — ОКВЭД 62
# IT-activity classification; vague "consulting"-sounding wording risks
# reclassification by the tax authority). Applied AFTER translation, as a
# rewrite pass on the Russian task text before it's written into the "Task"
# column. Only applies to ru reports — other languages don't need it unless
# an equivalent memo arrives for them.
# ---------------------------------------------------------------------------
task_wording_rules:
  rule_1_no_verbs:
    description: >
      Write the result as a noun phrase, never as a first-person verb
      describing the action taken.
    wrong: "Развернул локально бэк, занимался разработкой, фиксил баги."
    right: "Развертывание локальной среды бэкенда, разработка функционала, устранение дефектов в программном коде."

  rule_2_no_meetings:
    description: >
      Never mention meetings, calls, standups, or syncs by name (встреча,
      созвон, митинг, дейли) — the tax authority may read these as
      "general-purpose consulting." Reframe as the technical activity that
      happened during/around them.
    wrong: "Участие в созвоне по архитектуре, обсуждение задач на дейли, митинг со Scrum-мастером."
    right: "Анализ архитектурных требований, синхронизация технических этапов разработки, планирование спринта."

  rule_3_be_specific:
    description: >
      Never use vague catch-all phrases — name the exact component,
      module, or functionality worked on.
    wrong: "Выполнение работы по проекту, написание кода."
    right: "Доработка модуля авторизации, оптимизация базы данных, интеграция платежного шлюза."

  guiding_principle: >
    The report must show technical work on the software itself
    (development, design, optimization, testing, documentation) — never
    generic activity or consulting-sounding language.

  cheat_sheet:
    # informal phrasing (how Igor/closing comments naturally describe it) → required ТШ wording
    - informal: "Развернул локально бэк"
      formal: "Развертывание локальной среды бэкенда"
    - informal: "Занимался задачами из спринта"
      formal: "Выполнение плановых задач спринта"
    - informal: "Занимался разработкой / доработкой"
      formal: "Разработка нового функционала / Доработка программного кода"
    - informal: "Онбординг (доступы, окружение, архитектура)"
      formal: "Предпроектное обследование, технический онбординг, аудит архитектуры системы"
    - informal: "Настраивал пайплайн"
      formal: "Разработка и настройка CI/CD-пайплайнов"
    - informal: "Писал тесты"
      formal: "Разработка автотестов, проведение интеграционного тестирования"
    - informal: "Проводил ревью"
      formal: "Проведение технического рецензирования кода (Code Review)"

schema:
  # Source: Igor's company-provided ТШ template example (screenshots in the
  # "Памятка по ТШ" memo). ONE ROW PER WORKING DAY — never multiple rows for
  # the same date, and no per-day subtotal rows (unlike the earlier design).
  sheet_name: "Tracking"           # translate into client language, e.g. ru: "Учёт времени"
  columns:
    - { name: "Date",              type: date,   format: "YYYY-MM-DD", notes: "ru header: Дата" }
    - { name: "Task // Project",   type: string,  notes: "ru header: Задача // Проект — the client's own external tracker code(s) for that day (e.g. TORMED-389); issues without one are excluded, never a synthetic fallback. If a day covers more than one tracker code (N >= working_days case), join them with a comma in this same cell — never split one day across multiple rows" }
    - { name: "Work performed",    type: string,  notes: "ru header: Наименование работ/услуг — one or more activities for that day, comma-joined if several (e.g. 'Планирование, Настройка Docker, Онбординг'), translated into the client's language (see language.rule) and, for ru, rewritten per task_wording_rules before being written" }
    - { name: "Hours",             type: number,  notes: "ru header: Часы — always 8 for every working day, flat (no per-task split even when a day covers multiple tracker codes)" }

  grand_total:
    rule: >
      One total row at the bottom of the sheet (SUM of the Hours column) —
      no intermediate per-day subtotals, since each day is already exactly
      one row. Matches the company template example (bottom-right cell
      showing the period total, e.g. 48 for a 6-working-day period).

# ---------------------------------------------------------------------------
# SPREADING ALGORITHM
# Distributes the closed tasks found in a calendar-month sub-period across
# that sub-period's working days (Mon-Fri only) so every working day has
# >=1 row and sums to exactly 8h. Real per-task effort is not tracked —
# this is a reporting shape, not a diary.
# ---------------------------------------------------------------------------
spreading_algorithm: |
  Given (per calendar-month sub-period — see scenario's month-splitting step):
    tasks           = closed issues for the client in [sub_start, sub_end]
                       THAT HAVE A NON-EMPTY tracking code (client's own
                       external tracker — issues with no tracking code are
                       not real client-tracked work and are dropped before
                       this step runs), each as {tracking_code,
                       task_description}, ordered by the issue's closed_at
                       timestamp
    working_days     = list of Mon-Fri calendar dates in [sub_start, sub_end]
    N                = count(tasks)
    D                = count(working_days)

  The overall range is start_date = day after the previous report's
  end_date (no overlap between consecutive reports) through end_date =
  today. That range is split into one sub-period per calendar month before
  this algorithm runs — see spreading is always scoped to a single month.

  If N == 0 for a sub-period:
    do not generate a file for that month — tell the user there is nothing
    to report for it.

  ONE ROW PER WORKING DAY — always, regardless of N vs D:

  If N >= D:
    - Split `tasks` into D buckets in order, as evenly as possible
      (bucket sizes differ by at most 1 task).
    - Assign bucket i to working_days[i].
    - Write ONE row for that day: "Task // Project" = all tracker codes in
      the bucket, comma-joined; "Work performed" = all task_descriptions
      in the bucket, comma-joined (still per task_wording_rules); Hours = 8
      flat for the day (not split per task within the cell).

  If N < D:
    - Repeat `tasks` round-robin to produce exactly D entries, one per
      working day (task list cycles: task1, task2, ..., taskN, task1, ...).
    - Each working day gets exactly one row at 8h, using the task assigned
      to it by the round-robin cycle.

  Every working day must end up with exactly one row, Hours = 8. Non-working
  days (Sat/Sun) get no rows at all.

notes: >
  The tracking code is not free text and never synthetic — it must be the
  client's own external tracker code, captured as required input at
  ingest_task time (mandatory whenever a client_slug is set) and carried
  through to the issue's closing comment via close_task. Issues with no
  tracking code (internal/admin work, or client issues created before this
  requirement existed) are excluded from the report entirely, not given a
  fallback code.
