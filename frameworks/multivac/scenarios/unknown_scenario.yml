# source: https://raw.githubusercontent.com/Malstrom/zeroth/main/frameworks/multivac/scenarios/unknown_scenario.yml

id: unknown_scenario
on:
  - any message that does not match any other scenario
preconditions:
  - any
creates_issue: false
read: []
steps:
  - compute: closest_scenarios          # top 3 by semantic distance
  - if:
      condition: closest_scenarios is not empty
      then:
        - propose: "Did you mean: {{closest_scenarios}}?"
          on_confirm:
            - call:
                scenario: "{{chosen_scenario}}"
                file: "frameworks/multivac/scenarios/{{chosen_scenario}}.yml"
                load: on_demand
          on_reject:
            - say: "No multivac scenario covers this yet. Want me to propose a new one in zeroth (improve)?"
      else:
        - say: "No multivac scenario covers this yet. Want me to propose a new one in zeroth (improve)?"
output:
  state_changes: []
