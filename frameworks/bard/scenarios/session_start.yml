# source: https://raw.githubusercontent.com/Malstrom/zeroth/main/frameworks/bard/scenarios/session_start.yml

id: session_start
on:
  - this is the first message of the conversation and no other scenario matches
  - user greets bard or opens a new session
  - user asks where their projects stand
preconditions:
  - any
creates_issue: false
read:
  - .bard.yml
  - "projects/*/project.yml"
  - "projects/*/beats/*.yml"
  - "diary/{{year}}/*.yml"
  - "issues: {instance} open ordered_by updated desc"
  - .bard.yml
steps:
  - if:
      condition: identity_missing
      then:
        - call:
            scenario: onboarding
            file: frameworks/bard/scenarios/onboarding.yml
            load: on_demand
        - stop
  - compute: days_since_last_entry
  - compute: open_projects              # status, next planned beat, drafted vs total beats
  - compute: unused_material            # recent entries no beat draws on yet
  - compute: open_ritual_issue          # an open issue labelled ritual, if the reminder fired
  - say: |
      {{owner.name}}. Where we are:
      Open projects: {{open_projects | title, medium, status, next beat}}
      Last diary entry: {{days_since_last_entry}} days ago
      Material not used yet: {{unused_material | count, one-line themes | none}}
  - if:
      condition: ritual_set and (today is a ritual day or open_ritual_issue is not null)
      then:
        - call:
            scenario: ask_me
            file: frameworks/bard/scenarios/ask_me.yml
            load: on_demand
        - stop
  - ask: "Do we write today, or do you have something to tell me first?"
    note: >
      never open with how long it has been since the last entry as a reproach, and never call a
      gap a broken streak — report the date plainly and move on.
output:
  state_changes: []
